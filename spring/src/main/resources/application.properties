spring.application.name=catan
spring.datasource.url=jdbc:mysql://localhost:3306/catan?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=super3

# update: crea les taules si no hi són i no esborra les dades entre arrencades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Mateixos noms de taula i columna que el projecte Hibernate (sense convertir a snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Tot l'accés a dades es fa dins dels serveis (@Transactional)
spring.jpa.open-in-view=false
